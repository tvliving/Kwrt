# Kwrt Cudy TR3000 512MB 硬改版 (MT7981 + 512MB NAND) 固件构建
# 方案移植自 tvliving/cudy-tr3000-512（512MB 扩容机型：UBI 分区扩到约 505MiB，mod-490 布局）
# 另含可选 U-Boot（bl-mt798x 多布局）构建 job（手动触发 build_uboot=true 时运行）
name: 🛠️ Kwrt Cudy TR3000 512MB Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 编译完成后发布 Release
        type: boolean
        default: true
      build_uboot:
        description: 同时编译 U-Boot（bl-mt798x 多布局）
        type: boolean
        default: false
  schedule:
    # 每周一 09:00（北京时间，UTC+8 → UTC 01:00），与 kwrt-mt7981/mt7986 相同
    - cron: '0 1 * * 1'

permissions:
  contents: write

concurrency:
  group: kwrt-tr3000-512
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  TARGET: mediatek_filogic_tr3000_512
  TAG_PREFIX: kwrt-tr3000-512
  MIN_DEVICES: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout 构建配方
        uses: actions/checkout@v4

      - name: 获取日期
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 克隆 OpenWrt 源码（openwrt-25.12）
        run: |
          set -x
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: 构建目录挂到大盘
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "$PWD/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: 载入 Kwrt 定制（common diy.sh）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/diy.sh
          /bin/bash devices/common/diy.sh

      - name: 注入 TR3000 512MB 机型（diy.sh + diy 覆盖）
        run: |
          cd openwrt
          cp -f devices/common/.config .config
          echo >> .config
          cat "devices/$TARGET/.config" >> .config
          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi
          cp -Rf ./diy/* ./ 2>/dev/null || true

      - name: 应用补丁
        run: |
          cd openwrt
          cp -rn devices/common/patches "devices/$TARGET/" 2>/dev/null || true
          if [ -n "$(ls -A "devices/$TARGET"/*.bin.patch 2>/dev/null)" ]; then
            git apply "devices/$TARGET"/patches/*.bin.patch || true
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: defconfig 并校验机型
        run: |
          cd openwrt
          make defconfig
          # 与 Kwrt 官方一致：无线驱动全部置 n（固件体积/兼容考虑）
          sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          make defconfig

          echo "===== 启用的机型 ====="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config
          n=$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
          [ "$n" -eq "$MIN_DEVICES" ] || { echo "::error::机型数量应为 1，实际 $n"; exit 1; }
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-512mb-v1=y$' .config \
            || { echo "::error::cudy_tr3000-512mb-v1 未生效"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config || { echo "::error::target 未生效"; exit 1; }
          # 512MB NAND 校验：rootfs 体积必须小于 UBI 分区（.config 中值可能带或不带引号）
          ps=$(sed -n 's/^CONFIG_TARGET_ROOTFS_PARTSIZE="\{0,1\}\([0-9]\+\)"\{0,1\}$/\1/p' .config | tail -1)
          ps=${ps:-0}
          echo "ROOTFS_PARTSIZE=${ps}M（UBI 分区约 505MiB）"
          [ "$ps" -gt 0 ] && [ "$ps" -lt 480 ] || { echo "::error::rootfs 体积超出 512MB NAND"; exit 1; }

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          df -hT
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || {
            echo "::warning::并行编译失败，取错误日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target' build.log | tail -40 || true
            exit 1
          }
          df -hT

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        id: collect
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*cudy*tr3000*512* out/ 2>/dev/null || true
          ls -lh out || true
          ls out/*sysupgrade.bin >/dev/null 2>&1 \
            || { echo "::error::缺少 sysupgrade.bin"; ls openwrt/bin/targets/mediatek/filogic/ 2>/dev/null; exit 1; }
          DU=$(du -sh out | cut -f1)
          echo "size=$DU" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-tr3000-512-images
          path: out/
          retention-days: 14

      - name: 发布 Release
        if: ${{ github.event_name == 'schedule' || inputs.make_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_PREFIX }}-${{ env.DATE }}
          name: Kwrt Cudy TR3000 512MB (${{ env.DATE }})
          body: |
            Kwrt Cudy TR3000 硬改 512MB Flash (MT7981 + NAND) 自动编译

            - 源码: openwrt/openwrt \`openwrt-25.12\` + Kwrt devices/common 定制
            - 机型: cudy_tr3000-512mb-v1（UBI 分区扩至约 505MiB，rootfs 160M，其余为 rootfs_data 存储）
            - 默认 IP: 10.0.0.1 / 用户名 root / 无密码
            - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### 刷机说明
            - 需配合多布局 U-Boot（bl-mt798x，手动 dispatch 本工作流勾选 build_uboot 可产出）
            - U-Boot 网页刷机选择 **mod-490** 布局后，刷入 \`*-sysupgrade.bin\`
            - 从 128MB 版固件升级时硬件不匹配告警属正常，强制应用即可
          files: out/*
          fail_on_unmatched_files: false

  uboot:
    # U-Boot（bl-mt798x 多布局）仅在手动勾选 build_uboot 时编译（U-Boot 无需每周更新）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_uboot == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install gcc-aarch64-linux-gnu build-essential flex bison \
            libssl-dev device-tree-compiler python-is-python3
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 克隆 bl-mt798x
        run: git clone --depth 1 https://github.com/hanwckf/bl-mt798x -b master bl-mt798x

      - name: 注入 512MB 机型定义
        run: |
          cd bl-mt798x
          UBOOT_DIR=$(find . -maxdepth 1 -type d -name 'uboot-mtk-*' | head -1)
          echo "UBOOT_DIR=$UBOOT_DIR" >> "$GITHUB_ENV"
          cp ../devices/mediatek_filogic_tr3000_512/uboot-mod/mt7981_cudy_tr3000-v1_multi_layout_defconfig "$UBOOT_DIR/configs/"
          cp ../devices/mediatek_filogic_tr3000_512/uboot-mod/mt7981-cudy-tr3000-v1.dts "$UBOOT_DIR/arch/arm/dts/"
          cp ../devices/mediatek_filogic_tr3000_512/uboot-mod/index.html "$UBOOT_DIR/failsafe/fsdata/index.html"

      - name: 编译 U-Boot
        run: |
          cd bl-mt798x
          SOC=mt7981 BOARD=cudy_tr3000-v1 MULTI_LAYOUT=1 ./build.sh
          ls -lh output/

      - name: 上传 U-Boot
        uses: actions/upload-artifact@v4
        with:
          name: uboot-cudy-tr3000-512mb
          path: bl-mt798x/output/*.bin
          retention-days: 14
