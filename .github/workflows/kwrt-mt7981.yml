# Kwrt（kiddin9/Kwrt）MT7981 (Filogic 820) 固件构建
# 构建方式完全沿用 Kwrt 官方配方：openwrt/openwrt openwrt-25.12 源码
# + devices/common 的 diy 定制（kiddin9 软件源、内核补丁等）+ 本机型目录的配置
#
# 2026-11-21 改造：
#   1) 4 组 matrix 并行 —— 118 款机型按序号四等分，每组只启用自己那组的机型，
#      单 job 的镜像生成阶段从「118 款串行」降到「约 30 款」。
#      注意：包与内核的编译在每组都会完整做一遍（同 target、同包集合），
#      所以这部分要靠下面的 ccache 消除，两者必须一起用才有意义。
#   2) ccache 持久化 —— CONFIG_CCACHE=y + actions/cache，跨 run 复用已编译对象，
#      二次构建起通常能省掉一半以上的 C 编译时间。
name: 🛠️ Kwrt MT7981 (Filogic 820) Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 编译完成后发布 Release
        type: boolean
        default: true
permissions:
  contents: write

concurrency:
  group: kwrt-mt7981
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  TARGET: mediatek_filogic_mt7981
  TAG_PREFIX: kwrt-mt7981
  # 拆分组数。改这里必须同步改 jobs.build.strategy.matrix.group 的取值列表
  GROUPS: '4'
  # 每组至少要启用多少款机型（118 款 / 4 ≈ 22~30；考虑后续机型增减，下限放到 15）
  MIN_DEVICES_PER_GROUP: '15'
  # ccache 上限与校验方式。
  # 注意 CCACHE_DIR 不能在这里设：rules.mk 里是
  #   export CCACHE_DIR := $(if $(CONFIG_CCACHE_DIR),...,$(TOPDIR)/.ccache)
  # 用的是 := 强制赋值，环境变量会被它覆盖，所以缓存固定落在 openwrt/.ccache，
  # actions/cache 的 path 必须跟着它走，否则打包的是空目录。
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    name: build g${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # 一组失败不连坐其他组，产物还能出
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    env:
      GROUP: ${{ matrix.group }}

    steps:
      - name: Checkout 构建配方
        uses: actions/checkout@v4

      - name: 获取日期
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          ccache --version | head -1

      - name: 克隆 OpenWrt 源码（openwrt-25.12）
        run: |
          set -x
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: 恢复 ccache 缓存
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          # 路径必须是 openwrt/.ccache —— rules.mk 把 CCACHE_DIR 钉在 $(TOPDIR)/.ccache，
          # TOPDIR 就是 clone 出来的 openwrt 目录
          path: openwrt/.ccache
          # key 带 run_id 保证每次都能写入新版本；restore-keys 前缀匹配上一次的缓存。
          # 优先找同组，找不到再退到其他组（各组编的包完全一致，缓存可共享）。
          key: ccache-${{ env.TARGET }}-${{ github.run_id }}-g${{ matrix.group }}
          restore-keys: |
            ccache-${{ env.TARGET }}-g${{ matrix.group }}-
            ccache-${{ env.TARGET }}-

      - name: 构建目录挂到大盘
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "$PWD/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: 载入 Kwrt 定制（common diy.sh）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/diy.sh
          /bin/bash devices/common/diy.sh

      - name: 生成 .config（Kwrt common + MT7981 (Filogic 820) 机型）
        run: |
          cd openwrt
          cp -f devices/common/.config .config
          echo >> .config
          cat "devices/$TARGET/.config" >> .config
          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi
          cp -Rf ./diy/* ./ 2>/dev/null || true

      - name: 应用补丁
        run: |
          cd openwrt
          cp -rn devices/common/patches "devices/$TARGET/" 2>/dev/null || true
          if [ -n "$(ls -A "devices/$TARGET"/*.bin.patch 2>/dev/null)" ]; then
            git apply "devices/$TARGET"/patches/*.bin.patch || true
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: 启用中文语言包 + vendor iStore + 给 ≥128M 机型注入
        run: |
          cd openwrt
          # 中文包：打开 luci-i18n-*-zh-cn 生成（common 的 luci_mk.patch 默认关掉了）
          # iStore：树内 vendor 并删掉 feed 同名副本（否则仍按 feed 的架构约束被丢弃）
          bash devices/common/istore-zh.sh
          # iStore 只给闪存 >=128M 的机型，避免小闪存 image size 爆掉
          python3 devices/common/inject-istore-128m.py target/linux/mediatek/image/filogic.mk

      - name: defconfig 并校验机型
        run: |
          cd openwrt
          # 树内新增的包（iStore）必须强制重扫 package 元数据：
          # scan 结果缓存在 tmp/.packageinfo，不删会漏掉刚 vendor 进去的包，
          # 表现为 tmp/.config-package.in 里没有 PACKAGE_luci-app-store，
          # .config 写 =y 也会被静默丢弃
          rm -f tmp/.packageinfo tmp/.config-package.in
          make defconfig
          # 排除小闪存机型：Kwrt 全量 rootfs（内核+squashfs 约 54MB）装不进
          # IMAGE_SIZE < 60MB 的 NOR 机型，check-size 必失败（2026-11-13/14 连续失败实证：
          # cudy_re3000/wr3000 15M、iptime_ax3000q/se/sm/m 与 ax7800m-6e、netgear_wax220、
          # tplink/mercusys/zyxel/dlink 32~50M 等，共 28 款，从上游 filogic.mk 枚举）。
          # 这些机型与 Kwrt 固件体积不兼容，如需支持需单独裁剪包列表，勿直接恢复。
          SMALL_DEVICES="totolink_x6000r wavlink_wl-wn573hx3 yuncore_ax835 widelantech_wap430x kebidumei_ax3000-u22 cudy_re3000-v1 cudy_wr3000-v1 wavlink_wl-wn586x3 buffalo_wsr-6000ax8 gatonetworks_gdsp iptime_ax3000q iptime_ax3000se iptime_ax3000sm iptime_ax3000m iptime_ax7800m-6e netgear_wax220 tplink_fr365-v1 tplink_eap683-lr tenbay_wr3000k dlink_aquila-pro-ai-e30-a1 dlink_aquila-pro-ai-m30-a1 dlink_aquila-pro-ai-m60-a1 mercusys_mr90x-v1 tplink_archer-ax80-v1 tplink_archer-ax80-v1-eu tplink_be450 tplink_re6000xd zyxel_nwa50ax-pro"
          # 注意：只追加 "# ... is not set" 是无效的——.config 里已有的 "=y"（来自
          # devices/$TARGET/.config 与 ALL_PROFILES 的默认值）会先生效，kconfig 取第一条，
          # 结果这些机型still在编镜像，超限后 check-size 删掉产物让整轮构建失败
          # （11/15 MT7981/MT7986 两次实证）。这里先把已有赋值整行删掉，再统一追加 n。
          SYMS=""
          for d in $SMALL_DEVICES; do
            SYMS="$SYMS CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_$(echo "$d" | tr 'a-z-' 'A-Z_')"
          done
          python3 - $SYMS <<'PYEOF'
          import sys
          syms = set(sys.argv[1:])
          keep = []
          for line in open(".config", encoding="utf-8", errors="surrogateescape"):
              name = line.split("=")[0].replace("# ", "").split(" ")[0]
              if name in syms:
                  continue
              keep.append(line)
          for s in sys.argv[1:]:
              keep.append("# %s is not set" % s + "\n")
          open(".config", "w", encoding="utf-8", errors="surrogateescape").writelines(keep)
          PYEOF
          # 与 Kwrt 官方一致：无线驱动全部置 n（固件体积/兼容考虑）
          sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          # 简体中文语言包：全量枚举选入（kconfig 只会保留对应 app 已选中的那些）
          awk '/^config PACKAGE_luci-i18n-.+-zh-cn$/{print $2"=y"}' tmp/.config-package.in >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          # iStore 的守卫依赖：tar 被带入后 TAR_XZ 默认=y，xz-utils 不装 store 会被压没
          echo "CONFIG_PACKAGE_xz-utils=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-taskd=y" >> .config
          echo "CONFIG_PACKAGE_taskd=y" >> .config
          echo "CONFIG_PACKAGE_luci-lua-runtime=y" >> .config
          # ccache：OpenWrt 只有 CONFIG_CCACHE=y 才会把 CC 换成 ccache
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          grep -qE '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config \
            || { echo "::error::简体中文语言包未生效"; exit 1; }

          # ===== 机型分组：只保留本组机型，其余全部置 n =====
          # 必须在 defconfig 之后做：defconfig 会按 target 重新展开 ALL_PROFILES，
          # 提前改会被它覆盖回去。
          python3 - "$GROUP" "$GROUPS" <<'PYEOF'
          import sys
          group, groups = int(sys.argv[1]), int(sys.argv[2])
          prefix = "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_"
          lines = open(".config", encoding="utf-8", errors="surrogateescape").readlines()

          def dev_of(line):
              s = line[2:] if line.startswith("# ") else line
              if not s.startswith(prefix):
                  return None
              return s[len(prefix):].split("=")[0].split(" ")[0]

          # 只统计当前真正启用（=y）的机型：已被排除的小闪存机型（写的是 is not set）不参与分组
          enabled = sorted({d for l in lines
                            if (d := dev_of(l)) and l.startswith(prefix) and l.rstrip().endswith("=y")})
          all_devs = sorted({d for l in lines if (d := dev_of(l))})
          total = len(enabled)
          per, rem = divmod(total, groups)
          if group < rem:
              start, cnt = group * (per + 1), per + 1
          else:
              start, cnt = rem * (per + 1) + (group - rem) * per, per
          keep = enabled[start:start + cnt]
          keepset = set(keep)

          # 关键：非本组的机型必须显式写 "# ... is not set"，不能直接删行。
          # 删掉后 make defconfig 会按 target 的默认值重新展开 ALL_PROFILES，
          # 被排除的小闪存机型（以及别的组的机型）会被重新打开。
          out = [l for l in lines if dev_of(l) is None]
          out += ["%s%s=y\n" % (prefix, d) for d in keep]
          out += ["# %s%s is not set\n" % (prefix, d) for d in all_devs if d not in keepset]
          open(".config", "w", encoding="utf-8", errors="surrogateescape").writelines(out)
          print("分组 %d/%d：启用机型共 %d 款，本组保留 %d 款（第 %d~%d 款）"
                % (group + 1, groups, total, cnt, start + 1, start + cnt))
          for d in keep:
              print("   keep", d)
          PYEOF
          make defconfig

          echo "===== 本组启用的机型 ====="
          n=$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
          echo "本组机型数: $n（下限 $MIN_DEVICES_PER_GROUP）"
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config | head -5
          [ "$n" -ge "$MIN_DEVICES_PER_GROUP" ] \
            || { echo "::error::本组机型数不足，实际 $n（检查分组脚本）"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config || { echo "::error::target 未生效"; exit 1; }
          # 抽查排除是否真的生效：11/15 那次 gatonetworks_gdsp 在排除名单里却still编了
          # sdcard.img.gz，超限后把整轮构建带崩，这里至少把没排掉的机型打出来
          still=""
          for d in $SMALL_DEVICES; do
            s="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_$(echo "$d" | tr 'a-z-' 'A-Z_')=y"
            grep -q "^${s}$" .config && still="$still $d"
          done
          if [ -n "$still" ]; then
            echo "::warning::以下机型排除未生效（仍会编镜像，可能超限）：$still"
          else
            echo "✔ 小闪存机型已全部排除"
          fi
          if grep -q '^CONFIG_CCACHE=y$' .config; then
            echo "✔ ccache 已启用（缓存目录 openwrt/.ccache，上限 $CCACHE_MAXSIZE）"
          else
            echo "::warning::CONFIG_CCACHE 未生效，本次不走 ccache"
          fi

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          df -hT
          rm -f build.log
          ok=0
          PARTIAL=0
          for attempt in 1 2 3; do
            echo "===== world 第 $attempt 轮 ====="
            if make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log; then ok=1; break; fi
            echo "::warning::第 $attempt 轮并行编译失败，取错误日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target|failed to build' build.log | tail -40 || true
            # 保留 " [host]" 后缀：gettext-full 这类包失败时是
            #   ERROR: package/libs/gettext-full [host] failed to build.
            # 旧写法按第一个词取，整条匹配不上会误判成"没识别出失败包"
            mapfile -t pkgs < <(grep -oE '(package|feeds|tools|toolchain|target)/[A-Za-z0-9_./-]+( \[[a-zA-Z0-9_]+\])? failed to build' build.log \
                                  | sed 's/ failed to build$//' | sort -u)
            [ "${#pkgs[@]}" -gt 0 ] || { echo "::error::日志里没识别出失败包"; tail -80 build.log; exit 1; }
            die=0
            for pkg in "${pkgs[@]}"; do
              # target/linux 的失败点在镜像生成阶段（target/linux/install），
              # 重跑 compile 只会把内核再编一遍，看不到真正的报错
              case "$pkg" in
                target/linux) tgt="target/install" ;;
                *" [host]")   tgt="${pkg% \[host\]}/host/compile" ;;
                *" ["*)       tgt="${pkg% \[*}/compile" ;;
                *)            tgt="$pkg/compile" ;;
              esac
              echo "" >> build.log
              echo "===== 详细错误（make -j1 V=s $tgt）=====" >> build.log
              if timeout 3600 make -j1 V=s "$tgt" 2>&1 | tail -400 | tee -a build.log; then
                echo "::warning::$tgt 单线程重跑成功（并行竞态），继续后续编译" | tee -a build.log
              else
                case "$pkg" in
                  target/linux)
                    # 本组机型少，个别机型镜像超限不再拖垮整轮：
                    # 用 make -k 把其余机型尽量生成，只把失败机型记进日志
                    echo "::warning::target/install 仍失败，改用 make -k 继续生成其余机型" | tee -a build.log
                    make -k -j1 target/install 2>&1 \
                      | grep -E "WARNING: Image file .* is too big|Error [0-9]+|ERROR: |No such file" \
                      | tail -40 | tee -a build.log || true
                    PARTIAL=1
                    ;;
                  *)
                    echo "::error::$tgt 单线程重跑仍失败" | tee -a build.log
                    die=1
                    ;;
                esac
              fi
            done
            if [ "$die" = 1 ]; then
              echo "===== bin/targets 现状 =====" | tee -a build.log
              ls -lR bin/targets 2>&1 | tail -80 | tee -a build.log || true
              exit 1
            fi
            if [ "${PARTIAL:-0}" = 1 ]; then
              echo "::warning::部分机型镜像未生成（多为 IMAGE_SIZE 超限），其余机型继续发布"
              ok=1
              break
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::编译 3 轮后仍未成功"; exit 1; }
          echo "===== ccache 统计（缓存目录 openwrt/.ccache）====="
          CCACHE_DIR="$PWD/.ccache" ccache -s 2>&1 | head -20 || true
          df -hT

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # 4 个 job 并发，artifact 名必须唯一，否则 v4 直接报重名
          name: build-log-g${{ matrix.group }}
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        id: collect
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*.bin \
                openwrt/bin/targets/mediatek/filogic/*.itb \
                openwrt/bin/targets/mediatek/filogic/*.ubi \
                openwrt/bin/targets/mediatek/filogic/*.tar \
                openwrt/bin/targets/mediatek/filogic/profiles.json \
                openwrt/bin/targets/mediatek/filogic/sha256sums \
                openwrt/bin/targets/mediatek/filogic/mediatek-filogic.manifest \
                out/ 2>/dev/null || true
          ls -lh out | head -20
          cnt=$(ls out | wc -l)
          echo "产物文件数: $cnt"
          [ "$cnt" -ge 3 ] || { echo "::error::产物为空，疑似假成功"; exit 1; }
          DU=$(du -sh out | cut -f1)
          echo "size=$DU" >> "$GITHUB_OUTPUT"
          echo "本组机型数: $(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' openwrt/.config || true)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-mt7981-images-g${{ matrix.group }}
          path: out/
          retention-days: 14

      - name: 发布 Release
        # 4 个分组并发写同一个 tag，所以不用 softprops（它建 tag 会互相 422），
        # 改成 gh CLI：create 失败就用已存在的，upload 用 --clobber 幂等
        if: ${{ github.event_name == 'schedule' || inputs.make_release != false }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag="${TAG_PREFIX}-${DATE}"
          title="Kwrt MT7981 (Filogic 820) (${DATE})"
          mkdir -p rel
          shopt -s nullglob
          for f in out/*.bin out/*.itb out/*.ubi; do cp -f "$f" rel/; done
          # profiles.json / sha256sums 各组都会生成且内容只含本组机型，
          # 直接用原名上传会互相覆盖，这里加组号区分
          cp -f out/sha256sums "rel/sha256sums-g${GROUP}" 2>/dev/null || true
          cp -f out/profiles.json "rel/profiles-g${GROUP}.json" 2>/dev/null || true
          echo "本组待发布: $(ls rel | wc -l) 个文件（tag: $tag）"
          # 错开 0~20 秒，降低 4 个分组同时 create tag 的撞车概率
          sleep $(( RANDOM % 20 ))
          for i in 1 2 3 4 5; do
            echo ">>> 第 $i 次尝试上传"
            if ! gh release view "$tag" > /dev/null 2>&1; then
              gh release create "$tag" --title "$title" --notes "见 Actions 运行记录 ${{ github.run_id }}" || true
              sleep 3
            fi
            if gh release upload "$tag" rel/* --clobber; then
              echo ">>> 上传成功（第 $i 次）"
              exit 0
            fi
            echo ">>> 第 $i 次失败，$((i*30)) 秒后重试"
            sleep $((i*30))
          done
          echo "::error::Release 资产上传仍失败（多为 GitHub 二次限流），产物已保留在 Actions artifact 里"
          exit 1

      - name: 保存 ccache 缓存
        # 只让 g0 保存：4 组编的包完全一致，一份缓存就够，
        # 全存会很快吃满仓库 10GB 缓存额度
        if: matrix.group == 0 && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.TARGET }}-${{ github.run_id }}-g${{ matrix.group }}
