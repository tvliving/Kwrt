# Kwrt PHILIPS HY3000 (MT7981B + eMMC) 固件构建
# 方案移植自 tvliving/istoreos istoreos-25.12 分支已验证的 FIT(itb) 四件套方案：
#   preloader.bin（BL2，写 eMMC boot0 硬件分区）+ bl31-uboot.fip（写用户区 0x3400 扇区）
#   + gpt.bin（写扇区 0）+ sysupgrade.itb（FIT external-static-with-rootfs，root=/dev/fit0）
# WiFi 修复：DTS 使用 factory 校准数据 + uci-defaults 默认开启双频 radio
name: 🛠️ Kwrt PHILIPS HY3000 (MT7981 eMMC) Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 编译完成后发布 Release
        type: boolean
        default: true
  schedule:
    # 每周一 09:00（北京时间，UTC+8 → UTC 01:00），与 kwrt-mt7981/mt7986 相同
    - cron: '0 1 * * 1'

permissions:
  contents: write

concurrency:
  group: kwrt-hy3000
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  TARGET: mediatek_filogic_hy3000
  TAG_PREFIX: kwrt-hy3000
  MIN_DEVICES: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout 构建配方
        uses: actions/checkout@v4

      - name: 获取日期
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 克隆 OpenWrt 源码（openwrt-25.12）
        run: |
          set -x
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: 构建目录挂到大盘
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "$PWD/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: 载入 Kwrt 定制（common diy.sh）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/diy.sh
          /bin/bash devices/common/diy.sh

      - name: 注入 HY3000 机型（diy.sh + diy 覆盖 + 补丁）
        run: |
          cd openwrt
          cp -f devices/common/.config .config
          echo >> .config
          cat "devices/$TARGET/.config" >> .config
          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi
          cp -Rf ./diy/* ./ 2>/dev/null || true

      - name: 应用补丁
        run: |
          cd openwrt
          cp -rn devices/common/patches "devices/$TARGET/" 2>/dev/null || true

          # ── U-Boot 源码补丁单独路由 ───────────────────────────────────────────
          # *.uboot.patch 里的路径（configs/ 、arch/arm/dts/ 、defenvs/）都是 u-boot
          # 源码树内的相对路径，必须交给 uboot-mediatek 包在解压后的 u-boot 源码里打。
          # 若在 openwrt 根目录直接 patch，文件会被写到 openwrt/configs/ 等错误位置，
          # uboot 变体 mt7981_philips_hy3000 就找不到 defconfig，编译直接失败。
          UBP=package/boot/uboot-mediatek/patches
          mkdir -p "$UBP"
          shopt -s nullglob
          for f in "devices/$TARGET"/patches/*.uboot.patch; do
            dst="$UBP/$(basename "$f" .uboot.patch).patch"
            cp -f "$f" "$dst"
            echo ">>> U-Boot 补丁就位: $dst"
            for need in configs/mt7981_philips_hy3000_defconfig \
                        arch/arm/dts/mt7981-philips-hy3000.dts \
                        defenvs/philips_hy3000_env; do
              grep -qF "+++ b/$need" "$dst" || { echo "::error::$dst 缺少 $need"; exit 1; }
            done
          done
          shopt -u nullglob
          grep -q '^define U-Boot/mt7981_philips_hy3000' package/boot/uboot-mediatek/Makefile \
            || { echo "::error::uboot-mediatek Makefile 未注册 mt7981_philips_hy3000 变体"; exit 1; }

          if [ -n "$(ls -A "devices/$TARGET"/*.bin.patch 2>/dev/null)" ]; then
            git apply "devices/$TARGET"/patches/*.bin.patch || true
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' ! -name '*.uboot.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: defconfig 并校验机型
        run: |
          cd openwrt
          make defconfig
          # 与 Kwrt 官方一致：无线驱动全部置 n（固件体积/兼容考虑）
          sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          make defconfig

          echo "===== 启用的机型 ====="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config
          n=$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
          [ "$n" -eq "$MIN_DEVICES" ] || { echo "::error::机型数量应为 1，实际 $n"; exit 1; }
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y$' .config \
            || { echo "::error::philips_hy3000 未生效"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config || { echo "::error::target 未生效"; exit 1; }

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          df -hT
          if ! make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log; then
            echo "::warning::并行编译失败，取错误日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target|failed to build' build.log | tail -40 || true
            # 并行编译的输出会掩盖真正原因：定位失败包后单线程 V=s 重跑一次，把详细错误留在日志里
            pkgs=$(grep -oE '[A-Za-z0-9_./-]+ failed to build' build.log | awk '{print $1}' | sort -u || true)
            for pkg in $pkgs; do
              echo "" >> build.log
              echo "===== 详细错误（make -j1 V=s $pkg/compile）=====" >> build.log
              timeout 2400 make -j1 V=s "$pkg/compile" 2>&1 | tail -200 | tee -a build.log || true
            done
            exit 1
          fi
          df -hT

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        id: collect
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*philips*hy3000* out/ 2>/dev/null || true
          ls -lh out || true
          # 四件套缺一不可
          for f in sysupgrade.itb gpt.bin preloader.bin bl31-uboot.fip; do
            ls out/*"$f" >/dev/null 2>&1 || { echo "::error::缺少引导工件 $f"; ls out; exit 1; }
          done
          DU=$(du -sh out | cut -f1)
          echo "size=$DU" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-hy3000-images
          path: out/
          retention-days: 14

      - name: 发布 Release
        if: ${{ github.event_name == 'schedule' || inputs.make_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_PREFIX }}-${{ env.DATE }}
          name: Kwrt PHILIPS HY3000 (${{ env.DATE }})
          body: |
            Kwrt PHILIPS HY3000 (MT7981B + eMMC) 自动编译

            - 源码: openwrt/openwrt \`openwrt-25.12\` + Kwrt devices/common 定制
            - 引导: rax3000m 同款 FIT(itb) 四件套，U-Boot 网页刷机兼容
            - WiFi: 双频默认开启（factory 校准数据 + uci-defaults 强制启用），无射频锁死
            - 默认 IP: 10.0.0.1 / 用户名 root / 无密码
            - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### 刷机四件套（U-Boot 网页刷机）
            1. \`preloader.bin\` → 刷入 **preloader** 位置（BL2，写 eMMC boot0 硬件分区）
            2. \`bl31-uboot.fip\` → 刷入 **fip** 位置（ATF + U-Boot）
            3. \`gpt.bin\` → 刷入 **GPT** 位置（分区表）
            4. \`sysupgrade.itb\` → 刷入 **firmware** 位置（系统主体）
            5. （可选）\`*-initramfs-recovery.itb\` 为救援镜像，变砖时用 TFTP 引导恢复

            ⚠️ 四件必须配套使用，不要混用其他来源的 preloader/fip，否则可能变砖且无法恢复。
          files: out/*
          fail_on_unmatched_files: false
