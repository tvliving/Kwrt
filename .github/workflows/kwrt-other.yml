# Kwrt（kiddin9/Kwrt）其余 target 固件构建
# 用途：补齐仓库里已有 devices/<target> 配方、但还没有单独 workflow 的官方目标
#   bcm27xx_bcm2709 / bcm27xx_bcm2710 / bcm27xx_bcm2711 / bcm27xx_bcm2712
#   bcm53xx / siflower_sf21 / x86_64
# 注：ipq806x_generic / mediatek_filogic / rockchip_armv8 已拆成各自的 workflow
#     （kwrt-ipq806x_generic / kwrt-mediatek_filogic / kwrt-rockchip_armv8），
#     ipq40xx 按需求不再构建
# 构建方式完全沿用 Kwrt 官方配方：openwrt/openwrt openwrt-25.12 源码
# + devices/common 的 diy 定制 + 各自机型目录的 .config / diy.sh / patches
name: 🛠️ Kwrt Other Targets Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 编译完成后发布 Release
        type: boolean
        default: true
  schedule:
    # 每 8 天一次。GitHub cron 不支持真正的「每 N 天」，这里取每月 1/9/17/25 日 18:00 UTC
    # （次日 02:00 北京时间），相邻间隔 8/8/8 天，跨月因月份长度会短 1~2 天
    - cron: '0 18 */8 * *'

permissions:
  contents: write

concurrency:
  group: kwrt-other
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TARGET: ${{ matrix.dev }}
      TGT: ${{ matrix.tgt }}
      SUB: ${{ matrix.sub }}
      MIN_DEVICES: ${{ matrix.min_dev }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - dev: bcm27xx_bcm2709
            tgt: bcm27xx
            sub: bcm2709
            name: BCM2709 (Raspberry Pi 2)
            min_dev: 1
          - dev: bcm27xx_bcm2710
            tgt: bcm27xx
            sub: bcm2710
            name: BCM2710 (Raspberry Pi 3)
            min_dev: 1
          - dev: bcm27xx_bcm2711
            tgt: bcm27xx
            sub: bcm2711
            name: BCM2711 (Raspberry Pi 4)
            min_dev: 1
          - dev: bcm27xx_bcm2712
            tgt: bcm27xx
            sub: bcm2712
            name: BCM2712 (Raspberry Pi 5)
            min_dev: 1
          - dev: bcm53xx
            tgt: bcm53xx
            sub: generic
            name: BCM53XX (Generic)
            min_dev: 3
          - dev: siflower_sf21
            tgt: siflower
            sub: sf21
            name: Siflower SF21
            min_dev: 0
          - dev: x86_64
            tgt: x86
            sub: '64'
            name: X86_64
            min_dev: 0

    steps:
      - name: Checkout 构建配方
        uses: actions/checkout@v4

      - name: 获取日期
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 克隆 OpenWrt 源码（openwrt-25.12）
        run: |
          set -x
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: 构建目录挂到大盘
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "$PWD/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: 载入 Kwrt 定制（common diy.sh）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/diy.sh
          /bin/bash devices/common/diy.sh

      - name: 生成 .config（Kwrt common + 本 target 机型）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          cd openwrt
          cp -f devices/common/.config .config
          echo >> .config
          cat "devices/$TARGET/.config" >> .config
          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi
          cp -Rf ./diy/* ./ 2>/dev/null || true

      - name: 应用补丁
        run: |
          cd openwrt
          # 与 Kwrt 官方一致：common 通用补丁合并进本 target 的 patches 目录（不覆盖 target 自带同名补丁）
          mkdir -p "devices/$TARGET/patches"
          cp -rn devices/common/patches/. "devices/$TARGET/patches/" 2>/dev/null || true
          if [ -n "$(ls -A "devices/$TARGET"/*.bin.patch 2>/dev/null)" ]; then
            git apply "devices/$TARGET"/patches/*.bin.patch || true
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: defconfig 并校验机型
        run: |
          cd openwrt
          make defconfig
          # 与 Kwrt 官方一致：无 WiFi 的目标跳过无线驱动置 n
          if [[ ! "$TARGET" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|siflower_*|x86_*) ]]; then
            sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >> .config
            sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
            make defconfig
          fi

          echo "===== 启用的机型数（$TGT/$SUB） ====="
          # 25.12 两种机型行格式并存：CONFIG_TARGET_<t>_<s>_DEVICE_x / CONFIG_TARGET_DEVICE_<t>_<s>_DEVICE_x
          n=$(grep -cE "^CONFIG_TARGET_(DEVICE_)?${TGT}_${SUB}_DEVICE_.*=y$" .config || true)
          echo "启用机型: $n（下限 $MIN_DEVICES）"
          grep -E "^CONFIG_TARGET_(DEVICE_)?${TGT}_${SUB}_DEVICE_.*=y$" .config | head -5 || true
          [ "$n" -ge "$MIN_DEVICES" ] || { echo "::error::机型数量不足，实际 $n"; exit 1; }
          grep -q "^CONFIG_TARGET_${TGT}_${SUB}=y" .config || { echo "::error::target 未生效"; exit 1; }

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          df -hT
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log || {
            echo "::warning::并行编译失败，取错误日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target' build.log | tail -40 || true
            exit 1
          }
          df -hT

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.dev }}
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        id: collect
        run: |
          mkdir -p out
          find "openwrt/bin/targets/$TGT/$SUB" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' -o -name '*.tar' \
               -o -name '*.img' -o -name '*.gz' -o -name '*.zip' -o -name '*.vmdk' \
               -o -name 'profiles.json' -o -name 'sha256sums' -o -name '*manifest' \) -exec cp -f {} out/ \;
          ls -lh out | head -20
          cnt=$(ls out | wc -l)
          echo "产物文件数: $cnt"
          [ "$cnt" -ge 3 ] || { echo "::error::产物为空，疑似假成功"; exit 1; }
          DU=$(du -sh out | cut -f1)
          echo "size=$DU" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-${{ matrix.dev }}-images
          path: out/
          retention-days: 14

      - name: 发布 Release
        if: ${{ github.event_name == 'schedule' || inputs.make_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="kwrt-${{ matrix.dev }}-${{ env.DATE }}"
          TITLE="Kwrt ${{ matrix.name }} (${{ env.DATE }})"
          cat > notes.md <<NOTES
          Kwrt ${{ matrix.name }} 自动编译（$TGT/$SUB）

          - 源码: openwrt/openwrt \`openwrt-25.12\` + Kwrt \`devices/common\` 定制
          - 配方目录: devices/$TARGET（官方 .config 原样，不在清单内不编译）
          - 默认 IP: 10.0.0.1 / 用户名 root / 无密码
          NOTES
          echo "- 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> notes.md

          # 并发上传大资产会触发 GitHub secondary rate limit，逐个上传 + 指数退避重试
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加缺失资产"
          else
            for i in 1 2 3 4 5; do
              gh release create "$TAG" --title "$TITLE" --notes-file notes.md && break
              echo "创建 Release 失败（第 $i 次），等待重试"; sleep $((i * 20))
            done
          fi
          gh release view "$TAG" >/dev/null || { echo "::error::Release $TAG 创建失败"; exit 1; }

          total=0; failed=0
          for f in out/*; do
            total=$((total + 1))
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber >/dev/null 2>&1; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ "$ok" -eq 1 ] || { echo "::warning::上传失败: $f"; failed=$((failed + 1)); }
          done
          echo "资产总数: $total | 失败: $failed"
          [ "$failed" -eq 0 ] || { echo "::error::$failed 个资产上传失败"; exit 1; }
