# Kwrt 锐捷 RG-EW6000GX PRO (MT7986A) 固件构建
#
# 机型支持来源：chase535/immortalwrt-mt798x-6.6-cudy-wr3000v1
#   target/linux/mediatek/dts/mt7986a-ruijie-ew-6000gx-pro*.dts(+dtsi)
#   target/linux/mediatek/image/filogic.mk 的 ruijie_ew-6000gx-pro* 定义
#   filogic/base-files/etc/board.d/02_network 与 11_fix_wifi_mac 的对应分支
#
# 本工作流基于 openwrt-25.12 官方源码树，注入 devices-pack/ew6000gx 后编译
# 默认固件：ruijie_ew-6000gx-pro（107M 布局 + sysupgrade-tar，沿用原厂 U-Boot）
# 主题：luci-theme-vantage（已移除 argon）；内置 iStore 商店 + 简体中文包
name: Build Kwrt RG-EW6000GX Pro

on:
  schedule:
    # 每周六 09:00（北京时间 UTC+8 → UTC 01:00）
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kwrt-ew6000gx-pro
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SLUG: ew6000gx

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev pahole libdw-dev zstd
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 准备源码树（OpenWrt 25.12）
        run: |
          git clone -q --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt
          echo "已克隆 openwrt-25.12"

      - name: 注入设备包
        run: |
          python3 scripts/apply-pack.py openwrt "$SLUG"
          grep -n "ew-6000gx" openwrt/target/linux/mediatek/image/filogic.mk | tail -6
          ls openwrt/target/linux/mediatek/dts/ | grep -i 6000gx
          # 网口映射（WAN=eth1）：没有它，未识别的机型不会生成 wan 接口
          test -f openwrt/files/etc/board.d/02_network_ruijie \
            || { echo "::error::缺少 board.d 网口映射脚本"; exit 1; }
          ls -l openwrt/files/etc/board.d/

      - name: 生成基础 .config
        run: |
          cd openwrt
          {
            echo 'CONFIG_TARGET_mediatek=y'
            echo 'CONFIG_TARGET_mediatek_filogic=y'
            cat ../devices-pack/"$SLUG"/config.fragment
          } > .config
          echo "---- 基础配置 ----"; cat .config

      - name: 主题 / iStore / 中文包
        run: |
          cd openwrt
          bash ../scripts/customize.sh .

      - name: 校验机型与主题并 defconfig
        run: |
          cd openwrt
          # VERSION_DIST 定义在 package/base-files/image-config.in 的 if VERSIONOPT 内，
          # IMAGEOPT/VERSIONOPT 不全开时 make defconfig 会把 CONFIG_VERSION_DIST 丢掉，
          # 产物名就会退回上游默认的 openwrt-*，这里固定成仓库名。
          printf 'CONFIG_IMAGEOPT=y\nCONFIG_VERSIONOPT=y\n' >> .config
          make defconfig
          sed -i '/^CONFIG_VERSION_DIST=/d' .config
          echo 'CONFIG_VERSION_DIST="Kwrt"' >> .config
          grep -q '^CONFIG_VERSION_DIST="Kwrt"$' .config \
            || { echo "::error::VERSION_DIST 未生效（期望 kwrt-* 产物名）"; exit 1; }
          echo "---- 机型 ----"
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || {
            echo "::error::机型未生效，检查 filogic.mk 是否含对应 Device 定义"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-theme-vantage=y$' .config || { echo "::error::vantage 主题未生效"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci=y$' .config || { echo "::error::LuCI 主集合未选中，刷机后页面会缺失"; exit 1; }
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config || { echo "::error::uhttpd 未选中，刷机后只有 ssh 能进"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-mod-admin-full=y$' .config || { echo "::error::luci-mod-admin-full 未选中，LuCI 没有管理页面"; exit 1; }
          if grep -qE '^CONFIG_PACKAGE_luci-theme-(argon|bootstrap|material)=y$' .config; then
            echo "::error::仍有其他预装主题（只允许 luci-theme-vantage）"; exit 1; fi
          echo "---- 中文/商店 ----"
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config || { echo "::error::中文语言包未开启"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config || { echo "::error::LuCI 基础中文包未生效"; exit 1; }
          echo "---- store 诊断 ----"
          grep -n 'luci-app-store' .config | head -5 || true
          grep -q '^CONFIG_PACKAGE_xz-utils=y$' .config \
            || echo "::warning::xz-utils 未生效（luci-app-store 的 TAR_XZ 依赖不满足，会被 kconfig 丢弃）"
          grep -q '^CONFIG_PACKAGE_luci-app-store=y$' .config || {
            grep -A12 'config PACKAGE_luci-app-store' tmp/.config-package.in | head -20 || true
            echo "::error::iStore 市场未生效"; exit 1; }

      - name: 包体检（列出被 kconfig 丢弃的包）
        run: |
          cd openwrt
          miss=0
          while IFS= read -r p; do
            p="$(printf '%s' "$p" | tr -d '\r' | sed 's/[[:space:]]*$//')"
            case "$p" in ''|'#'*) continue ;; esac
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config || { echo "::warning::包未生效: $p"; miss=$((miss+1)); }
          done < ../devices-pack/ew6000gx/packages.txt
          total=$(grep -c '^CONFIG_PACKAGE_.*=y$' .config || true)
          echo "选中包总数: $total ；被丢弃: $miss"
          for k in luci uhttpd luci-mod-admin-full luci-theme-vantage luci-app-store \
                   kmod-mt7915e kmod-mt7986-firmware iwinfo \
                   luci-compat luci-lua-runtime luci-app-quickstart quickstart; do
            grep -q "^CONFIG_PACKAGE_${k}=y$" .config || { echo "::error::关键包缺失: $k"; exit 1; }
          done
          # wpad 变体随仓库默认不同，只要有一个 hostapd 套件就行
          grep -qE '^CONFIG_PACKAGE_(wpad-basic-mbedtls|wpad-openssl|wpad-mbedtls|wpad)=y$' .config \
            || { echo "::error::关键包缺失: wpad（无线接入点守护进程）"; exit 1; }

      - name: 关闭 BTF（规避 tools/dwarves 构建失败）
        run: |
          cd openwrt
          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config; then
            sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_BTF=y/# CONFIG_KERNEL_DEBUG_INFO_BTF is not set/' .config
            echo "已关闭 CONFIG_KERNEL_DEBUG_INFO_BTF"
          fi
          make defconfig
          # VERSION_DIST 会被 defconfig 重置，必须在最后一次 defconfig 之后再写。
          # 只改名产物不够：/etc/openwrt_release 里的 DISTRIB_ID 也来自它，
          # 不改就会导致 LuCI 登录页显示 OpenWrt（用户反馈的问题 2）。
          sed -i '/^CONFIG_VERSION_DIST=/d' .config
          echo 'CONFIG_VERSION_DIST="Kwrt"' >> .config
          grep -q '^CONFIG_VERSION_DIST="Kwrt"$' .config \
            || { echo "::error::VERSION_DIST 写入失败"; exit 1; }
          grep -q 'default "Kwrt"' package/base-files/image-config.in \
            || { echo "::error::image-config.in 默认发行版不是 Kwrt（登录页会显示 OpenWrt）"; exit 1; }
          echo "品牌：$(grep '^CONFIG_VERSION_DIST=' .config)"

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          if make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log; then
            echo "编译成功"
          else
            fail="$(grep -o 'ERROR: [^ ]* failed to build' build.log | head -1 | awk '{print $2}')"
            echo "== 失败包: ${fail:-未识别}"
            grep -n 'Error [0-9]\|error:\|ERROR:' build.log | tail -20 || true
            if [ -n "$fail" ] && [ -d "$fail" ]; then
              echo "::group::单包详细编译（$fail）"
              make "$fail/compile" V=s -j1 2>&1 | tail -120 || true
              echo "::endgroup::"
            fi
            echo "::error::并行编译失败，真实错误见上方日志"
            exit 1
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*ew-6000gx* out/ 2>/dev/null || true
          cp -f openwrt/bin/targets/mediatek/filogic/*.json out/ 2>/dev/null || true
          # 产物名统一以仓库名为前缀。VERSION_DIST 会被后续的 make defconfig 吃掉，
          # 不能只靠它，这里做兜底改名（已经是 kwrt-* 的跳过）。
          for f in out/*mediatek-filogic-*ew-6000gx*; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case "$b" in
              kwrt-*) : ;;
              openwrt-*) mv -f "$f" "out/kwrt-${b#openwrt-}"; echo "改名: $b -> kwrt-${b#openwrt-}" ;;
              *) mv -f "$f" "out/kwrt-$b"; echo "改名: $b -> kwrt-$b" ;;
            esac
          done
          # 多分区 U-Boot 只需要一个 sysupgrade 刷机包
          n=$(ls out | grep -c 'ew-6000gx') || true
          [ "$n" = "1" ] || { echo "::error::应当只有 1 个刷机包，实际 $n 个"; ls -l out; exit 1; }
          # 体积守卫：包没进镜像时（历史问题：只剩 9MB）直接失败，不再静默发空壳包
          size=$(stat -c %s out/*ew-6000gx*.bin | sort -n | tail -1)
          [ "$size" -ge 18000000 ] || { echo "::error::镜像仅 $((size/1048576))MB，明显缺包（预期 >=18MB）"; ls -l out; exit 1; }
          ls out | grep -q '^kwrt-.*ew-6000gx' \
            || { echo "::error::产物名不是 kwrt-* 前缀"; ls -l out; exit 1; }
          (cd out && sha256sum ./* > sha256sums.txt) 2>/dev/null || true
          ls -lh out

      - name: 镜像体检（品牌 / 首页 / 无线驱动是否真的进包）
        run: |
          sudo apt-get -qq install -y squashfs-tools >/dev/null 2>&1 || true
          rm -rf /tmp/img /tmp/rootfs && mkdir -p /tmp/img
          bin=$(ls out/*ew-6000gx*.bin | head -1)
          tar -xf "$bin" -C /tmp/img
          root=$(find /tmp/img -name root -o -name rootfs | head -1)
          [ -n "$root" ] || { echo "::error::镜像里找不到 rootfs"; find /tmp/img -maxdepth 2 | head; exit 1; }
          # runner 不是 root，unsquashfs 创建 /dev/console 之类设备节点会返回非 0，
          # 但对只读校验没有影响，这里忽略退出码，改为检查关键目录是否解出来。
          unsquashfs -q -d /tmp/rootfs "$root" >/dev/null 2>&1 || true
          [ -d /tmp/rootfs/etc ] || { echo "::error::rootfs 解包失败"; ls -l /tmp/img; exit 1; }
          echo "---- 发行版 ----"
          grep -E '^DISTRIB_(ID|DESCRIPTION)=' /tmp/rootfs/etc/openwrt_release || true
          grep -q "^DISTRIB_ID=.*Kwrt" /tmp/rootfs/etc/openwrt_release \
            || { echo "::error::发行版不是 Kwrt（LuCI 登录页会显示 OpenWrt）"; exit 1; }
          echo "---- 首页 ----"
          test -f /tmp/rootfs/usr/lib/lua/luci/controller/quickstart.lua \
            || { echo "::error::缺少 quickstart 首页 controller"; exit 1; }
          echo "---- 网口映射 ----"
          test -x /tmp/rootfs/etc/board.d/02_network_ruijie \
            || { echo "::error::缺少 board.d 网口映射（WAN 会缺失）"; exit 1; }
          echo "---- 无线 ----"
          ls /tmp/rootfs/lib/modules/*/mt7915e.ko >/dev/null 2>&1 \
            || { echo "::error::缺少 mt7915e 驱动（无线菜单不会出现）"; exit 1; }
          ls /tmp/rootfs/lib/firmware/mediatek/mt7986_* 2>/dev/null | head -3 || true
          echo "---- 主题 ----"
          grep -q "'pinned'" /tmp/rootfs/usr/share/ucode/luci/template/themes/vantage/header.ut 2>/dev/null \
            && echo "左侧导航默认展开：已生效" \
            || echo "::warning::未确认左侧导航默认展开"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-${{ env.SLUG }}-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: 计算发布标签（每机型每周一个 Release）
        if: success()
        id: rel
        run: echo "tag=kwrt-${{ env.SLUG }}-$(TZ=Asia/Shanghai date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Kwrt EW-6000GX Pro · ${{ steps.rel.outputs.tag }}
          body: |
            自动构建：tvliving/Kwrt / ruijie_ew-6000gx-pro（MT7986A）
            - 每机型每周一个 Release，同周重跑覆盖同一个 tag，不会堆积多个版本
            - 文件名前缀固定为仓库名（kwrt-*），不再产出 openwrt-* 副本
            - 定时：每周六 09:00（北京时间）
            - 主题：luci-theme-vantage（已移除 argon），首启默认中文界面，左侧导航默认展开
            - 内置：iStore 软件中心 + quickstart 首页仪表盘 + 简体中文语言包
            - 网口：LAN=lan1-lan4，WAN=eth1（2.5G Airoha EN8811H），后台 192.168.110.1
            - 布局：107M UBI + sysupgrade-tar（沿用原厂 U-Boot）
            - 运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/*
          fail_on_unmatched_files: false
