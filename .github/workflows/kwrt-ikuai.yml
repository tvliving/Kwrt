# Kwrt iKuai 机型固件构建（自 XIAOZHAOXSXH / dailook 移植）
#
# 机型（3）：
#   - ikuai_q3000       Q3000  MT7981A SPI-NAND（FIT，原厂 uboot 不动）
#   - ikuai_q6000       Q6000  MT7986A NAND（sysupgrade-tar）
#   - ikuai_q6000-emmc  Q6000  MT7986A eMMC（sysupgrade-tar）
#
# Q6000 DTS 来自 dailook/immortalwrt-24.10 原样；Q3000 DTS 按 25.12 主线骨架
# 重写（去 SDK 专有 nmbm/hnat/trng，分区/MAC/LED/按键保留原厂值）。
# 不产出 preloader / fip / gpt 引导工件。
name: 🛠️ Kwrt iKuai (Q3000/Q6000) Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 编译完成后发布 Release
        type: boolean
        default: true
  push:
    branches: [25.12]
    paths:
      - '.github/workflows/kwrt-ikuai.yml'
      - 'devices/mediatek_filogic_ikuai/**'
  schedule:
    # 周二 / 周四 12:00（北京时间，UTC+8 → UTC 04:00），与其他仓库定时任务一致
    - cron: '0 4 * * 2,4'

permissions:
  contents: write

concurrency:
  group: kwrt-ikuai
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  TARGET: mediatek_filogic_ikuai
  TAG_PREFIX: kwrt-ikuai
  MIN_DEVICES: '3'
  DEVICES: >-
    ikuai_q3000 ikuai_q6000 ikuai_q6000-emmc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout 构建配方
        uses: actions/checkout@v4

      - name: 获取日期
        run: echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: 释放磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 克隆 OpenWrt 源码（openwrt-25.12）
        run: |
          set -x
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt openwrt

      - name: 构建目录挂到大盘
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf "$PWD/openwrt/staging_dir" /mnt/openwrt/staging_dir

      - name: 载入 Kwrt 定制（common diy.sh）
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          export REPO_TOKEN="${{ secrets.KWRT_TOKEN }}"
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf "devices/$TARGET/." openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/diy.sh
          /bin/bash devices/common/diy.sh

      - name: 注入 iKuai 设备（diy.sh + diy 覆盖）
        run: |
          cd openwrt
          cp -f devices/common/.config .config
          echo >> .config
          cat "devices/$TARGET/.config" >> .config
          if [ -f "devices/$TARGET/diy.sh" ]; then
            chmod +x "devices/$TARGET/diy.sh"
            /bin/bash "devices/$TARGET/diy.sh"
          fi
          cp -Rf ./diy/* ./ 2>/dev/null || true
          # DTS 落位核查
          for d in mt7981b-ikuai-q3000 mt7986a-ikuai-q6000 mt7986a-ikuai-q6000-emmc; do
            [ -f "target/linux/mediatek/dts/$d.dts" ] \
              || { echo "::error::DTS 缺失: $d"; exit 1; }
          done
          grep -q 'compatible = "ikuai,q3000"' target/linux/mediatek/dts/mt7981b-ikuai-q3000.dts \
            || { echo "::error::Q3000 DTS 内容异常"; exit 1; }
          grep -q 'include "mt7986a.dtsi"' target/linux/mediatek/dts/mt7986a-ikuai-q6000.dts \
            || { echo "::error::Q6000 DTS include 异常"; exit 1; }

      - name: 应用补丁
        run: |
          cd openwrt
          cp -rn devices/common/patches "devices/$TARGET/" 2>/dev/null || true
          if [ -n "$(ls -A "devices/$TARGET"/*.bin.patch 2>/dev/null)" ]; then
            git apply "devices/$TARGET"/patches/*.bin.patch || true
          fi
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" || true
          find "devices/$TARGET/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null \
            | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'" || true

      - name: 启用中文语言包 + 树内 vendor iStore
        run: |
          cd openwrt
          bash devices/common/istore-zh.sh

      - name: defconfig 并校验机型
        run: |
          cd openwrt
          rm -f tmp/.packageinfo tmp/.config-package.in
          make defconfig
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          # 全量简体中文语言包（注意：.config-package.in 的 config 行带 tab 前缀，
          # 不能用 ^config 锚定）
          awk '/^[[:space:]]*config PACKAGE_luci-i18n-.+-zh-cn$/{print "CONFIG_"$2"=y"}' tmp/.config-package.in >> .config
          {
            echo "CONFIG_PACKAGE_wpad-openssl=y"
            echo "CONFIG_PACKAGE_wireless-regdb=y"
            echo "CONFIG_PACKAGE_luci-app-store=y"
            echo "CONFIG_PACKAGE_luci-app-quickstart=y"
            echo "CONFIG_PACKAGE_luci-lib-taskd=y"
            echo "CONFIG_PACKAGE_taskd=y"
            echo "CONFIG_PACKAGE_luci-lua-runtime=y"
            echo "CONFIG_PACKAGE_libuci-lua=y"
            echo "CONFIG_PACKAGE_mount-utils=y"
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_quickstart=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"
            echo "CONFIG_PACKAGE_xz-utils=y"
          } >> .config
          make defconfig
          grep -qE '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config \
            || { echo "::error::简体中文语言包未生效"; exit 1; }

          for s in luci-app-store luci-app-quickstart luci-i18n-base-zh-cn; do
            grep -qE "^CONFIG_PACKAGE_${s}=y$" .config \
              || { echo "::error::${s} 未生效（iStore 或中文包会缺失）"; exit 1; }
          done
          n=$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.+-zh-cn=y$' .config || true)
          [ "$n" -ge 5 ] || { echo "::error::简体中文语言包数量异常：$n"; exit 1; }
          echo "✔ iStore 已选入，简体中文语言包 $n 个"

          echo "===== 启用的机型 ====="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config
          n=$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
          [ "$n" -eq "$MIN_DEVICES" ] || { echo "::error::机型数量应为 $MIN_DEVICES，实际 $n"; exit 1; }
          miss=""
          for d in $DEVICES; do
            sym="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${d}=y"
            grep -q "^${sym}$" .config || miss="$miss $d"
          done
          [ -z "$miss" ] || { echo "::error::机型未生效：$miss"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config || { echo "::error::target 未生效"; exit 1; }

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          df -hT
          rm -f build.log
          ok=0
          PARTIAL=0
          for attempt in 1 2 3; do
            echo "===== world 第 $attempt 轮 ====="
            if make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log; then ok=1; break; fi
            echo "::warning::第 $attempt 轮并行编译失败，取错误日志"
            grep -nE 'Error [0-9]+|error:|No rule to make target|failed to build' build.log | tail -40 || true
            mapfile -t pkgs < <(grep -oE '(package|feeds|tools|toolchain|target)/[A-Za-z0-9_./-]+( \[[a-zA-Z0-9_]+\])? failed to build' build.log \
                                  | sed 's/ failed to build$//' | sort -u)
            [ "${#pkgs[@]}" -gt 0 ] || { echo "::error::日志里没识别出失败包"; tail -80 build.log; exit 1; }
            die=0
            for pkg in "${pkgs[@]}"; do
              case "$pkg" in
                target/linux) tgt="target/install" ;;
                *" [host]")   tgt="${pkg% \[host\]}/host/compile" ;;
                *" ["*)       tgt="${pkg% \[*}/compile" ;;
                *)            tgt="$pkg/compile" ;;
              esac
              echo "" >> build.log
              echo "===== 详细错误（make -j1 V=s $tgt）=====" >> build.log
              if timeout 3600 make -j1 V=s "$tgt" 2>&1 | tail -400 | tee -a build.log; then
                echo "::warning::$tgt 单线程重跑成功（并行竞态），继续后续编译" | tee -a build.log
              else
                case "$pkg" in
                  target/linux)
                    echo "::warning::target/install 仍失败，改用 make -k 继续生成其余机型" | tee -a build.log
                    make -k -j1 target/install 2>&1 \
                      | grep -E "WARNING: Image file .* is too big|Error [0-9]+|ERROR: |No such file" \
                      | tail -40 | tee -a build.log || true
                    PARTIAL=1
                    ;;
                  *)
                    echo "::error::$tgt 单线程重跑仍失败" | tee -a build.log
                    die=1
                    ;;
                esac
              fi
            done
            if [ "$die" = 1 ]; then
              echo "===== bin/targets 现状 =====" | tee -a build.log
              ls -lR bin/targets 2>&1 | tail -80 | tee -a build.log || true
              exit 1
            fi
            if [ "${PARTIAL:-0}" = 1 ]; then
              echo "::warning::部分机型镜像未生成，其余机型继续发布"
              ok=1
              break
            fi
          done
          [ "$ok" = 1 ] || { echo "::error::编译 3 轮后仍未成功"; exit 1; }
          df -hT

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 收集产物
        id: collect
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*.bin \
                openwrt/bin/targets/mediatek/filogic/*.tar \
                openwrt/bin/targets/mediatek/filogic/mediatek-filogic.manifest \
                openwrt/bin/targets/mediatek/filogic/profiles.json \
                openwrt/bin/targets/mediatek/filogic/sha256sums \
                out/ 2>/dev/null || true
          ls -lh out | head -40
          # 3 个机型每个都必须有 sysupgrade 产物
          miss=""
          for d in ikuai_q3000 ikuai_q6000 ikuai_q6000-emmc; do
            ls out/"*$d*-sysupgrade."* >/dev/null 2>&1 || miss="$miss $d"
          done
          [ -z "$miss" ] || { echo "::error::以下机型缺 sysupgrade 产物：$miss"; ls out; exit 1; }
          # 引导工件硬性拒绝（防误刷变砖）
          if ls out/ | grep -qiE 'preloader|bl31|gpt|factory-ubi'; then
            echo "::error::产物里出现引导工件，拒绝发布"; ls out; exit 1
          fi
          (cd out && sha256sum ./* > sha256sums.txt)
          DU=$(du -sh out | cut -f1)
          echo "size=$DU" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-ikuai-images
          path: out/
          retention-days: 14

      - name: 发布 Release
        id: pub
        continue-on-error: true
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_PREFIX }}-${{ env.DATE }}
          name: Kwrt iKuai Q3000/Q6000 (${{ env.DATE }})
          body: |
            Kwrt iKuai 机型自动编译（自 XIAOZHAOXSXH / dailook 移植）

            - 源码: openwrt/openwrt `openwrt-25.12` + Kwrt `devices/common` 定制
            - 机型: ikuai_q3000（Q3000，MT7981 NAND） / ikuai_q6000（Q6000，MT7986 NAND） /
              ikuai_q6000-emmc（Q6000，MT7986 eMMC）
            - 引导: **沿用机器现有 U-Boot，不刷 preloader / fip / gpt**
            - 默认主题: luci-theme-vantage；含 iStore 软件市场 + 全量简体中文语言包
            - 定时: 每周二 / 周四 12:00（北京时间）
            - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/*
          fail_on_unmatched_files: false

      - name: 重试上传 Release 资产（GitHub 二次限流兜底）
        if: ${{ steps.pub.outcome == 'failure' && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag="${{ env.TAG_PREFIX }}-${{ env.DATE }}"
          title="Kwrt iKuai Q3000/Q6000 (${{ env.DATE }})"
          echo ">>> 目标 tag: $tag"
          for i in 1 2 3 4 5; do
            echo ">>> 第 $i 次尝试上传"
            if ! gh release view "$tag" > /dev/null 2>&1; then
              gh release create "$tag" --title "$title" --notes "见 Actions 运行记录 ${{ github.run_id }}" || true
            fi
            if gh release upload "$tag" out/* --clobber; then
              echo ">>> 上传成功（第 $i 次）"
              exit 0
            fi
            echo ">>> 第 $i 次失败，$((i*30)) 秒后重试"
            sleep $((i*30))
          done
          echo "::error::Release 资产上传仍失败（多为 GitHub 二次限流），产物已保留在 Actions artifact 里"
          exit 1
