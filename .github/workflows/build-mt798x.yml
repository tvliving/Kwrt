# Kwrt 多机型编译：SL-3000 / SL-3000 eMMC、Ruijie RG-X30E、Ruijie RG-X30E Pro、Ruijie RG-X60 New、Globitel BT-R320、Ruijie RG-BE72 Pro (U-Boot mod)
# 每日 09:00（北京时间，UTC+8）定时构建，产物发布到 Release
name: Build Kwrt MT798x

on:
  schedule:
    # 每周一至周日 09:00（北京时间）→ UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: '机型（all = 全部）'
        required: false
        default: 'all'
  push:
    paths:
      - '.github/workflows/build-mt798x.yml'

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # matrix 只能在 job 级使用，放到 workflow 级会导致工作流非法（run 无 job）
    concurrency:
      group: Kwrt-${{ github.ref }}-${{ matrix.slug }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        slug: [sl3000, rgx30e, x30epro, x60new, btr320, be72pro]
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 过滤手动选择机型
        id: pick
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slug != 'all' && inputs.slug != matrix.slug }}
        run: echo "selected=false" >> "$GITHUB_OUTPUT"

      - name: 释放磁盘空间
        if: steps.pick.outputs.selected != 'false'
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装依赖
        if: steps.pick.outputs.selected != 'false'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev             pahole libdw-dev zstd
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 准备源码树
        if: steps.pick.outputs.selected != 'false'
        run: |
          git clone -q --depth 1 -b "openwrt-25.12" https://github.com/openwrt/openwrt openwrt
          echo "已克隆上游 https://github.com/openwrt/openwrt"

      - name: 注入设备包
        if: steps.pick.outputs.selected != 'false'
        run: |
          python3 scripts/apply-pack.py openwrt "${{ matrix.slug }}"
          grep -c "define Device/" openwrt/target/linux/mediatek/image/filogic.mk
          ls openwrt/target/linux/mediatek/dts/ | grep -E "x30e|x60-new|sl-3000|bt-r320"

      - name: 注入 BE72 专用驱动（RTL837x 交换芯片）
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          if [ -d "../devices-pack/${{ matrix.slug }}/packages" ]; then
            cp -r ../devices-pack/"${{ matrix.slug }}"/packages/* package/kernel/
            ls package/kernel | grep -E 'rtl837x'
          else
            echo "设备包无 packages/ 目录，跳过驱动注入"
          fi

      - name: 生成基础 .config
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          {
            echo 'CONFIG_TARGET_mediatek=y'
            echo 'CONFIG_TARGET_mediatek_filogic=y'
            cat ../devices-pack/"${{ matrix.slug }}"/config.fragment
          } > .config
          echo "---- 基础配置 ----"; cat .config

      - name: 主题 / iStore / 中文包
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          bash ../scripts/customize.sh .

      - name: 校验机型与主题并 defconfig
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          make defconfig
          echo "---- 机型 ----"
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || {
            echo "::error::机型未生效，检查 filogic.mk 是否含对应 Device 定义"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-theme-vantage=y$' .config || { echo "::error::vantage 主题未生效"; exit 1; }
          if grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config; then echo "::error::argon 仍在配置中"; exit 1; fi
          echo "---- 中文/商店 ----"
          grep -E '^CONFIG_(LUCI_LANG_zh_Hans|PACKAGE_luci-app-store)' .config || true

      - name: 关闭 BTF（规避 tools/dwarves 构建失败）
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          if grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config; then
            sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_BTF=y/# CONFIG_KERNEL_DEBUG_INFO_BTF is not set/' .config
            echo "已关闭 CONFIG_KERNEL_DEBUG_INFO_BTF"
          fi
          make defconfig
          grep -c 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config || true

      - name: 编译
        if: steps.pick.outputs.selected != 'false'
        run: |
          cd openwrt
          set -o pipefail
          if make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log; then
            echo "编译成功"
          else
            echo "::warning::并行编译失败，串行重跑 target/linux 以输出真实错误"
            make target/linux/install V=s 2>&1 | tail -150 || true
            echo "::error::target/linux 镜像阶段失败，错误见上方日志"
            exit 1
          fi

      - name: 收集产物
        if: steps.pick.outputs.selected != 'false'
        run: |
          mkdir -p out
          cp -f openwrt/bin/targets/mediatek/filogic/*sysupgrade* out/ 2>/dev/null || true
          (cd out && sha256sum ./* > sha256sums.txt) 2>/dev/null || true
          ls -lh out

      - name: 上传 artifact
        if: steps.pick.outputs.selected != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Kwrt-${{ matrix.slug }}
          path: out/
          retention-days: 14

      - name: 计算发布标签（每机型每天一个 Release）
        if: steps.pick.outputs.selected != 'false' && success()
        id: rel
        run: echo "tag=${{ matrix.slug }}-$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: steps.pick.outputs.selected != 'false' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Kwrt ${{ matrix.slug }} · ${{ steps.rel.outputs.tag }}
          body: |
            自动构建：Kwrt / ${{ matrix.slug }}
            - 定时：每天 09:00（北京时间）
            - 主题：luci-theme-vantage（已移除 argon）
            - 内置：iStore 软件中心 + 简体中文语言包
            - 运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/*
          fail_on_unmatched_files: false
